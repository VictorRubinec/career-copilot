[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "2.0.0"
description = "Agente Autônomo e Copiloto de Carreira, Vagas Remotas e Turnos Noturnos/Assíncronos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "playwright>=1.45.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
career-copilot = "src.cli:main"

[project.urls]
Homepage = "https://github.com/VictorRubinec/career-copilot"
Repository = "https://github.com/VictorRubinec/career-copilot"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
